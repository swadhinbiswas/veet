<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="iconVGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="iconAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="iconBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.3" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="85" fill="#00F0FF" opacity="0.1" filter="url(#iconGlow)"/>

  <!-- Icon Container Card -->
  <rect x="20" y="20" width="160" height="160" rx="40" fill="#0F172A" stroke="#1E293B" stroke-width="2" filter="url(#iconShadow)"/>
  <rect x="20" y="20" width="160" height="160" rx="40" fill="none" stroke="url(#iconBorderGrad)" stroke-width="2" opacity="0.7"/>

  <!-- Geometric Grid Accent -->
  <line x1="40" y1="100" x2="160" y2="100" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="100" y1="40" x2="100" y2="160" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- V Wings -->
  <!-- Left Wing -->
  <path d="M 48 54 L 82 54 L 100 126 L 82 148 L 48 54 Z" fill="url(#iconAccentGrad)" filter="url(#iconGlow)"/>
  
  <!-- Right Wing -->
  <path d="M 152 54 L 118 54 L 86 144 L 102 144 L 152 54 Z" fill="url(#iconVGrad)" filter="url(#iconGlow)"/>

  <!-- Center Energy Sparkle -->
  <polygon points="100,46 106,66 126,71 106,77 100,97 94,77 74,71 94,66" fill="#00F0FF" opacity="0.95" filter="url(#iconGlow)"/>

  <!-- Center Focal Core Node -->
  <circle cx="100" cy="144" r="4" fill="#FFFFFF"/>
</svg>
